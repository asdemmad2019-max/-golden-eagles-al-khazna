<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الأدمن - النسور الذهبية | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Cairo',system-ui,Arial,sans-serif;font-size:16px;line-height:1.7}
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.97);border-bottom:1px solid #FFD700;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;flex-wrap:wrap}
header b{font-size:19px;color:#FFD700}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 18px 0}
nav button{background:#111;border:1px solid #333;color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;font-size:14px}
nav button.active{background:#FFD700;color:#000;border-color:#FFD700;font-weight:800}
.wrap{max-width:1100px;margin:auto;padding:16px 18px 60px}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:12px}
.card b{color:#FFD700}
input,select,textarea{width:100%;background:#1a1a1a;border:1px solid #444;color:#fff;padding:11px 12px;border-radius:10px;margin:6px 0;font-family:inherit;font-size:15px}
textarea{min-height:70px}
button{cursor:pointer}
.btn-gold{background:linear-gradient(#FFE27A,#FFD700,#B8860B);color:#000;border:none;padding:11px 18px;border-radius:999px;font-weight:800;font-size:15px}
.btn-ghost{background:#111;border:1px solid #FFD700;color:#FFD700;padding:11px 16px;border-radius:999px;font-size:15px}
.btn-danger{background:#2a0f0f;border:1px solid #f55;color:#f88;padding:11px 16px;border-radius:999px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:120px}
.small{font-size:12px;color:#aaa}
.ok{color:#4caf50}.err{color:#f55}.gold{color:#FFD700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #222;padding:8px;text-align:right;vertical-align:top}
th{color:#FFD700}
img.thumb{max-width:100%;border-radius:12px;border:1px solid #FFD700;margin-top:8px;display:block}
#toast{position:fixed;bottom:18px;right:18px;left:18px;background:#FFD700;color:#000;padding:13px 16px;border-radius:12px;font-weight:800;display:none;z-index:999;text-align:center}
.hidden{display:none}
.badge{display:inline-block;background:#222;border:1px solid #444;padding:2px 10px;border-radius:999px;font-size:12px}
.badge.p{background:#2a2a00;border-color:#FFD700;color:#FFD700}
.badge.a{background:#0a2a0a;border-color:#4caf50;color:#4caf50}
.badge.r{background:#2a0f0f;border-color:#f55;color:#f88}
</style>
</head>
<body>
<header>
  <b>🦅 لوحة الأدمن — النسور الذهبية</b>
  <span class="small" id="adminWho">غير مسجل دخول</span>
  <span>
    <button class="btn-ghost" onclick="location.href='index.html'">🏠 الموقع</button>
    <button class="btn-ghost" onclick="doLogout()">🚪 خروج</button>
  </span>
</header>

<!-- LOGIN -->
<div class="wrap" id="loginBox">
  <div class="card" style="max-width:480px;margin:30px auto;text-align:center">
    <h2 style="color:#FFD700">دخول الأدمن</h2>
    <p class="small">الإيميل: <b style="color:#fff">asdemmad2019@gmail.com</b><br>الباسورد هو اللي سويته بـ Supabase &gt; Authentication، مو باسورد الجيميل.</p>
    <input id="adminPass" type="password" placeholder="كلمة مرور الأدمن">
    <button class="btn-gold" style="width:100%" onclick="doLogin()">دخول 🔐</button>
    <p class="small" id="loginMsg" style="margin-top:10px"></p>
    <p class="small" id="sbStatus">⏳ جارٍ فحص الاتصال...</p>
  </div>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
  <nav id="tabs"></nav>
  <div class="wrap"><div id="content"></div></div>
</div>
<div id="toast"></div>

<script>
var SUPABASE_URL='https://narqpwtdzvmaznvnbyxz.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_jbTXPgruD8VpgmloWTapbQ_XhRQ2XfW';
var ADMIN_EMAIL='asdemmad2019@gmail.com';
var sb=null, session=null, currentTab='overview';
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(function(){t.style.display='none';},4000); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function loadLS(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function initSb(){ if(!sb){ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); } return sb; }
async function doLogin(){
  var p=(document.getElementById('adminPass').value||'').trim();
  if(!p){ document.getElementById('loginMsg').textContent='اكتب كلمة المرور أولاً'; return; }
  document.getElementById('loginMsg').textContent='⏳ جارٍ التحقق...';
  try{
    initSb();
    var r=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:p});
    if(r.error){ document.getElementById('loginMsg').textContent='❌ '+r.error.message; return; }
    session=r.data.session;
    document.getElementById('adminPass').value='';
    showPanel();
  }catch(e){ document.getElementById('loginMsg').textContent='❌ '+e.message; }
}
async function doLogout(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} session=null; location.reload(); }
async function checkSession(){
  try{
    initSb();
    var s=document.getElementById('sbStatus'); if(s) s.textContent='✅ الاتصال بالسحابة شغال';
    var r=await sb.auth.getSession();
    if(r.data && r.data.session && r.data.session.user && r.data.session.user.email===ADMIN_EMAIL){ session=r.data.session; showPanel(); }
  }catch(e){}
}
function showPanel(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('adminWho').textContent='✅ أدمن: '+ADMIN_EMAIL;
  renderTabs(); goTab('overview');
}
var TABS=[
  ['overview','📊 نظرة عامة'],['plans','💰 الخطط'],['planOrders','🛒 طلبات الخطط'],
  ['deposits','💰 إيداعات'],['withdraws','💸 سحوبات'],['transfers','🔄 تحويلات'],
  ['members','👥 الأعضاء'],['support','💬 الدعم'],['proofs','🧾 إثباتات'],
  ['anns','📢 إعلانات'],['coupons','🎟️ أكواد'],['pay','💳 طرق الدفع'],
  ['wallet','🏦 محفظة المنصة'],['settings','⚙️ الإعدادات']
];
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="'+(t[0]===currentTab?'active':'')+'" onclick="goTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
}
function goTab(t){ currentTab=t; renderTabs(); document.getElementById('content').innerHTML='<p>⏳ جارٍ التحميل...</p>';
  var fn={overview:tabOverview,plans:tabPlans,planOrders:tabPlanOrders,deposits:tabDeposits,withdraws:tabWithdraws,transfers:tabTransfers,members:tabMembers,support:tabSupport,proofs:tabProofs,anns:tabAnns,coupons:tabCoupons,pay:tabPay,wallet:tabWallet,settings:tabSettings}[t];
  if(fn){ try{ var r=fn(); if(r && r.catch) r.catch(function(e){ document.getElementById('content').innerHTML='<p class="err">خطأ: '+esc(e.message)+'</p>'; }); }catch(e){ document.getElementById('content').innerHTML='<p class="err">خطأ: '+esc(e.message)+'</p>'; } }
}
function setContent(html){ document.getElementById('content').innerHTML=html; }
function statusBadge(s){
  s=String(s||'pending');
  if(s.indexOf('approv')===0||s==='approved') return '<span class="badge a">✅ معتمد</span>';
  if(s.indexOf('reject')===0||s==='rejected') return '<span class="badge r">❌ مرفوض</span>';
  return '<span class="badge p">⏳ معلق</span>';
}
// ---- Edge approve (money_requests) ----
async function edgeApprove(requestId,approve){
  try{
    if(!session){ toast('سجل دخول الأدمن أولاً'); return false; }
    var r=await fetch(SUPABASE_URL+'/functions/v1/approve_money_request',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({request_id:requestId,approve:!!approve})});
    var j=await r.json().catch(function(){return {};});
    if(r.ok){ toast(approve?'تم الاعتماد بالسيرفر ✅':'تم الرفض بالسيرفر'); return true; }
    toast('❌ Edge: '+(j.error||r.status)+' - جرب التحديث المباشر');
    return false;
  }catch(e){ toast('❌ Edge فشل: '+e.message); return false; }
}
// ---- OVERVIEW ----
async function tabOverview(){
  initSb();
  var counts={};
  var queries=[
    ['plans',sb.from('plans').select('name',{count:'exact',head:true})],
    ['plan_orders',sb.from('plan_orders').select('id',{count:'exact',head:true}).eq('status','pending')],
    ['deposits_log',sb.from('deposits_log').select('id',{count:'exact',head:true}).eq('status','pending')],
    ['money_requests',sb.from('money_requests').select('id',{count:'exact',head:true}).eq('status','pending')],
    ['support',sb.from('support_messages').select('id',{count:'exact',head:true})],
    ['ge_users',sb.from('ge_users').select('id',{count:'exact',head:true})]
  ];
  for(var i=0;i<queries.length;i++){ try{ var rr=await queries[i][1]; counts[queries[i][0]]=rr.count!=null?rr.count:'?'; }catch(e){ counts[queries[i][0]]='?'; } }
  var wallet=loadLS('ge_platform_wallet',0);
  var plans=loadLS('ge_plans',[]);
  setContent(
    '<h2>📊 نظرة عامة</h2>'+
    '<div class="grid">'+
    '<div class="card"><small>الخطط</small><b style="font-size:24px;display:block">'+counts.plans+'</b></div>'+
    '<div class="card"><small>طلبات خطط معلقة</small><b style="font-size:24px;display:block">'+counts.plan_orders+'</b></div>'+
    '<div class="card"><small>إيداعات معلقة</small><b style="font-size:24px;display:block">'+counts.deposits_log+'</b></div>'+
    '<div class="card"><small>طلبات مالية معلقة</small><b style="font-size:24px;display:block">'+counts.money_requests+'</b></div>'+
    '<div class="card"><small>الأعضاء (Supabase)</small><b style="font-size:24px;display:block">'+counts.ge_users+'</b></div>'+
    '<div class="card"><small>رسائل الدعم</small><b style="font-size:24px;display:block">'+counts.support+'</b></div>'+
    '<div class="card"><small>محفظة المنصة (محلي)</small><b style="font-size:24px;display:block">'+fmt(wallet)+'</b></div>'+
    '<div class="card"><small>الخطط المحلية</small><b style="font-size:24px;display:block">'+plans.length+'</b></div>'+
    '</div>'+
    '<div class="card"><h4>⚡ إجراءات سريعة</h4><div class="row" style="margin-top:8px">'+
    '<button class="btn-gold" onclick="goTab(\'deposits\')">إيداعات معلقة</button>'+
    '<button class="btn-gold" onclick="goTab(\'withdraws\')">سحوبات معلقة</button>'+
    '<button class="btn-gold" onclick="goTab(\'transfers\')">تحويلات معلقة</button>'+
    '<button class="btn-gold" onclick="goTab(\'planOrders\')">طلبات خطط</button>'+
    '</div></div>'+
    '<p class="small">هذه لوحة منفصلة (admin.html) — نفس قاعدة Supabase ونفس المتصفح، لذلك localStorage مشترك مع الموقع.</p>'
  );
}
// ---- PLANS ----
async function tabPlans(){
  initSb();
  var localPlans=loadLS('ge_plans',[]);
  var sbPlans=[];
  try{ var r=await sb.from('plans').select('*').order('price',{ascending:true}); if(r.data) sbPlans=r.data; }catch(e){}
  var rows=localPlans.map(function(p,i){
    return '<tr><td><input id="pn'+i+'" value="'+esc(p.name||'')+'"></td>'+
    '<td><input id="pp'+i+'" type="number" value="'+(p.price||0)+'"></td>'+
    '<td><input id="pr'+i+'" type="number" step="0.1" value="'+(p.rate||0)+'"></td>'+
    '<td><input id="pd'+i+'" type="number" value="'+(p.duration||30)+'"></td>'+
    '<td><input id="pdesc'+i+'" value="'+esc(p.desc||'')+'"></td>'+
    '<td><button class="btn-gold" onclick="savePlan('+i+')">💾 حفظ</button> <button class="btn-danger" onclick="deletePlan('+i+')">🗑️ حذف</button></td></tr>';
  }).join('');
  setContent('<h2>💰 الخطط</h2>'+
    '<p class="small">الخطط المحلية (تظهر بالموقع) + خطط Supabase: <b>'+sbPlans.length+'</b> — الحفظ يدفع لـ Supabase بالقوة.</p>'+
    '<div class="card"><table><tr><th>الاسم</th><th>السعر $</th><th>النسبة %</th><th>المدة (يوم)</th><th>الوصف</th><th></th></tr>'+rows+'</table></div>'+
    '<div class="card"><h4>➕ خطة جديدة</h4><div class="row">'+
    '<input id="newPlanName" placeholder="اسم الخطة"><input id="newPlanPrice" type="number" placeholder="السعر $">'+
    '<input id="newPlanRate" type="number" step="0.1" placeholder="النسبة %">'+
    '<input id="newPlanDur" type="number" placeholder="المدة (يوم) - افتراضي 30"><input id="newPlanDesc" placeholder="الوصف">'+
    '</div><button class="btn-gold" style="width:100%;margin-top:8px" onclick="addPlan()">➕ إضافة خطة - تدفع لـ Supabase فوراً</button></div>'+
    '<div class="card"><h4>☁️ مزامنة</h4><button class="btn-ghost" onclick="pushPlans()">🔄 إعادة الدفع لـ Supabase</button> <button class="btn-ghost" onclick="pullPlans()">⬇️ جلب من Supabase (دمج فقط)</button><p class="small" id="plansStatus" style="margin-top:8px"></p></div>'
  );
}
function getPlans(){ return loadLS('ge_plans',[]); }
function setPlans(p){ saveLS('ge_plans',p); }
async function pushPlans(){
  var plans=getPlans();
  try{
    var rows=plans.map(function(p){ return {name:String(p.name||''),price:Number(p.price||0),rate:Number(p.rate||0),description:String(p.desc||''),duration:parseInt(p.duration||30)||30,updated_at:new Date().toISOString()}; });
    if(!rows.length){ toast('ماكو خطط للدفع'); return; }
    var r=await sb.from('plans').upsert(rows,{onConflict:'name'});
    if(r.error){ toast('❌ الدفع فشل: '+r.error.message+' — شغّل ملف supabase-migration-fix.sql'); }
    else { toast('☁️ الخطط تزامنت مع Supabase ✅'); }
  }catch(e){ toast('❌ '+e.message); }
  goTab('plans');
}
async function pullPlans(){
  try{
    var r=await sb.from('plans').select('*').order('price',{ascending:true});
    if(r.error){ toast('❌ الجلب فشل: '+r.error.message); return; }
    var fromSb=(r.data||[]).map(function(x){ return {name:String(x.name||''),price:Number(x.price||0),rate:Number(x.rate||0),desc:x.description||'',duration:parseInt(x.duration||30)||30}; });
    var plans=getPlans(), by={}; plans.forEach(function(p){ if(p&&p.name) by[String(p.name).toLowerCase()]=1; });
    var added=0; fromSb.forEach(function(p){ if(p.name && !by[String(p.name).toLowerCase()]){ plans.push(p); added++; } });
    if(added){ setPlans(plans); toast('☁️ رجعت '+added+' خطة من Supabase'); } else toast('ماكو خطط جديدة بـ Supabase');
  }catch(e){ toast('❌ '+e.message); }
  goTab('plans');
}
async function savePlan(i){
  var plans=getPlans();
  plans[i]={name:document.getElementById('pn'+i).value||('خطة '+(i+1)),price:parseFloat(document.getElementById('pp'+i).value)||100,rate:parseFloat(document.getElementById('pr'+i).value)||2,duration:parseInt(document.getElementById('pd'+i).value)||30,desc:document.getElementById('pdesc'+i).value||''};
  setPlans(plans); await pushPlans();
}
async function addPlan(){
  var plans=getPlans();
  plans.push({name:document.getElementById('newPlanName').value||('خطة '+(plans.length+1)),price:parseFloat(document.getElementById('newPlanPrice').value)||100,rate:parseFloat(document.getElementById('newPlanRate').value)||2,duration:parseInt(document.getElementById('newPlanDur').value)||30,desc:document.getElementById('newPlanDesc').value||'خطة جديدة'});
  setPlans(plans); await pushPlans();
}
async function deletePlan(i){
  var plans=getPlans(); var nm=plans[i]?plans[i].name:'';
  plans.splice(i,1); setPlans(plans);
  try{ if(nm) await sb.from('plans').delete().eq('name',nm); }catch(e){}
  toast('تم حذف الخطة ✅'); goTab('plans');
}
// ---- PLAN ORDERS ----
async function tabPlanOrders(){
  initSb();
  var r=await sb.from('plan_orders').select('*').order('created_at',{ascending:false}).limit(100);
  if(r.error){ setContent('<p class="err">خطأ: '+esc(r.error.message)+'</p>'); return; }
  var rows=(r.data||[]).map(function(o){
    return '<div class="card"><b>'+esc(o.code||'')+'</b> — '+esc(o.plan_name||'')+' — '+fmt(o.amount)+' — '+esc(o.customer_name||o.customer_email||'')+'<br><small>'+esc(o.customer_email||'')+' | '+esc(o.created_at||'')+'</small><br>'+statusBadge(o.status)+
    '<div class="row" style="margin-top:8px"><button class="btn-gold" onclick="decidePlanOrder(\''+o.id+'\',true)">✅ قبول وتفعيل</button><button class="btn-danger" onclick="decidePlanOrder(\''+o.id+'\',false)">❌ رفض</button></div></div>';
  }).join('') || '<p>لا توجد طلبات خطط.</p>';
  setContent('<h2>🛒 طلبات الخطط</h2>'+rows);
}
async function decidePlanOrder(id,approve){
  try{
    var r=await sb.from('plan_orders').update({status:approve?'approved':'rejected',decided_at:new Date().toISOString()}).eq('id',id);
    if(r.error){ toast('❌ '+r.error.message); return; }
    if(approve){
      // تفعيل محلي أيضاً (localStorage مشترك مع الموقع)
      try{
        var ord=await sb.from('plan_orders').select('*').eq('id',id).single();
        var o=ord.data;
        if(o){
          var plans=getPlans(); var pl=plans.find(function(p){return p.name===o.plan_name;});
          var dur=pl?(pl.duration||30):30;
          var ap=loadLS('ge_active_plans',[]);
          if(!ap.some(function(x){return x.orderCode===o.code;})){
            ap.push({name:o.plan_name,price:Number(o.amount||0),rate:pl?pl.rate:0,duration:dur,startDate:new Date().toISOString(),endDate:new Date(Date.now()+dur*24*3600*1000).toISOString(),start:new Date().toLocaleString('ar-EG'),orderCode:o.code||'',buyer:o.customer_name||'',email:o.customer_email||''});
            saveLS('ge_active_plans',ap);
          }
        }
      }catch(e){}
      toast('تم قبول طلب الخطة وتفعيلها ✅');
    } else toast('تم رفض طلب الخطة');
    goTab('planOrders');
  }catch(e){ toast('❌ '+e.message); }
}
// ---- DEPOSITS ----
async function tabDeposits(){
  initSb();
  var r=await sb.from('deposits_log').select('*').order('created_at',{ascending:false}).limit(100);
  if(r.error){ setContent('<p class="err">خطأ: '+esc(r.error.message)+'</p>'); return; }
  var rows=(r.data||[]).map(function(d){
    return '<div class="card"><b>'+esc(d.customer_name||d.customer_email||'ضيف')+'</b> — '+fmt(d.amount)+' عبر '+esc(d.deposit_method||'')+'<br><small>'+esc(d.customer_email||'')+' | '+esc(d.created_at||'')+' | '+esc(d.code||'')+'</small><br>'+statusBadge(d.status)+
    (d.proof_img?'<a href="'+d.proof_img+'" target="_blank"><img class="thumb" src="'+d.proof_img+'"></a><small>📸 صورة الوصل - اضغط للتكبير</small>':'<br><small class="gold">⚠️ بدون صورة وصل - يعتمد بالقوة</small>')+
    '<div class="row" style="margin-top:8px"><button class="btn-gold" onclick="decideDeposit(\''+d.id+'\',true)">✅ تأكيد الإيداع</button><button class="btn-danger" onclick="decideDeposit(\''+d.id+'\',false)">❌ رفض</button></div></div>';
  }).join('') || '<p>لا توجد إيداعات.</p>';
  setContent('<h2>💰 طلبات الإيداع</h2>'+rows);
}
async function decideDeposit(id,approve){
  try{
    var r=await sb.from('deposits_log').update({status:approve?'approved':'rejected',decided_at:new Date().toISOString(),admin_note:approve?'تم تأكيد الإيداع من الأدمن':'مرفوض من الأدمن'}).eq('id',id);
    if(r.error){ toast('❌ '+r.error.message); return; }
    toast(approve?'تم تأكيد الإيداع ✅':'تم رفض الإيداع');
    goTab('deposits');
  }catch(e){ toast('❌ '+e.message); }
}
// ---- MONEY REQUESTS (withdraws / transfers) ----
async function tabMoney(kind,title){
  initSb();
  var r=await sb.from('money_requests').select('*').eq('kind',kind).order('created_at',{ascending:false}).limit(100);
  if(r.error){ setContent('<p class="err">خطأ: '+esc(r.error.message)+'</p>'); return; }
  var rows=(r.data||[]).map(function(m){
    return '<div class="card"><b>'+esc(m.user_id||'')+'</b> — '+fmt(m.amount)+' — إلى: '+esc(m.to_email||m.method||'')+'<br><small>'+esc(m.created_at||'')+' | ID: '+esc(m.id)+'</small><br>'+statusBadge(m.status)+
    (m.proof_url?'<a href="'+m.proof_url+'" target="_blank"><img class="thumb" src="'+m.proof_url+'"></a><small>📸 إثبات - اضغط للتكبير</small>':'')+
    '<div class="row" style="margin-top:8px"><button class="btn-gold" onclick="decideMoney(\''+m.id+'\',true,\''+kind+'\')">✅ اعتماد</button><button class="btn-danger" onclick="decideMoney(\''+m.id+'\',false,\''+kind+'\')">❌ رفض</button></div></div>';
  }).join('') || '<p>لا توجد طلبات.</p>';
  setContent('<h2>'+title+'</h2>'+rows);
}
async function decideMoney(id,approve,kind){
  var ok=await edgeApprove(id,approve);
  if(!ok){
    // تحديث مباشر كبديل بالقوة
    try{
      var r=await sb.from('money_requests').update({status:approve?'approved':'rejected'}).eq('id',id);
      if(r.error){ toast('❌ '+r.error.message); return; }
      toast(approve?'تم الاعتماد (تحديث مباشر) ✅':'تم الرفض (تحديث مباشر)');
    }catch(e){ toast('❌ '+e.message); return; }
  }
  goTab(kind==='withdraw'?'withdraws':'transfers');
}
async function tabWithdraws(){ return tabMoney('withdraw','💸 طلبات السحب'); }
async function tabTransfers(){ return tabMoney('transfer','🔄 طلبات التحويل'); }

// ---- SUPPORT ----
async function tabSupport(){
  initSb();

async function delSupport(id){

async function addAnn(){

  if(r.error){ toast('❌ '+r.error.message); return; }

}
async function toggleAnn(id,v){ var r=await sb.from('announcements').update({active:v}).eq('id',id); if(r.error){toast('❌ '+r.error.message);return;} toast('تم التحديث'); goTab('anns'); }
async function delAnn(id){ var r=await sb.from('announcements').delete().eq('id',id); if(r.error){toast('❌ '+r.error.message);return;} toast('تم الحذف'); goTab('anns'); }
// ---- COUPONS (محلي - مشترك مع الموقع) ----
function tabCoupons(){
  var coupons=loadLS('ge_coupons',[]);
  var rows=coupons.map(function(c,i){
    return '<tr><td>'+esc(c.code)+'</td><td>'+esc(c.off)+'%</td><td>'+(c.active?'✅':'⏸️')+'</td><td><button class="btn-ghost" onclick="toggleCoupon('+i+')">🔄</button> <button class="btn-danger" onclick="delCoupon('+i+')">🗑️</button></td></tr>';
  }).join('') || '<tr><td colspan="4">لا توجد أكواد.</td></tr>';
  setContent('<h2>🎟️ أكواد الخصم</h2><div class="card"><div class="row"><input id="cpCode" placeholder="الكود"><input id="cpOff" type="number" placeholder="النسبة %"></div><button class="btn-gold" style="width:100%;margin-top:8px" onclick="addCoupon()">➕ إضافة كود</button></div><div class="card"><table><tr><th>الكود</th><th>الخصم</th><th>الحالة</th><th></th></tr>'+rows+'</table></div><p class="small">الأكواد محلية (نفس المتصفح) — تظهر بالموقع فوراً.</p>');
}
function addCoupon(){ var c=loadLS('ge_coupons',[]); var code=(document.getElementById('cpCode').value||'').toUpperCase(); var off=parseFloat(document.getElementById('cpOff').value)||0; if(!code||!off){toast('اكتب الكود والنسبة');return;} c.push({code:code,off:off,active:true}); saveLS('ge_coupons',c); toast('تمت إضافة الكود ✅'); goTab('coupons'); }
function toggleCoupon(i){ var c=loadLS('ge_coupons',[]); c[i].active=!c[i].active; saveLS('ge_coupons',c); goTab('coupons'); }
function delCoupon(i){ var c=loadLS('ge_coupons',[]); c.splice(i,1); saveLS('ge_coupons',c); goTab('coupons'); }
// ---- PAY METHODS (محلي) ----
function tabPay(){
  var pay=loadLS('ge_pay',[]);
  var rows=pay.map(function(p,i){
    return '<tr><td><input id="payN'+i+'" value="'+esc(p.name||'')+'"></td><td><input id="payD'+i+'" value="'+esc(p.detail||'')+'"></td><td>'+(p.active?'✅':'⏸️')+'</td><td><button class="btn-gold" onclick="savePay('+i+')">💾</button> <button class="btn-ghost" onclick="togglePay('+i+')">🔄</button> <button class="btn-danger" onclick="delPay('+i+')">🗑️</button></td></tr>';
  }).join('') || '<tr><td colspan="4">لا توجد طرق دفع.</td></tr>';
  setContent('<h2>💳 طرق الدفع / السحب</h2><div class="card"><table><tr><th>الاسم</th><th>التفاصيل</th><th>الحالة</th><th></th></tr>'+rows+'</table></div><div class="card"><h4>➕ طريقة جديدة</h4><div class="row"><input id="newPayName" placeholder="الاسم (مثال: زين كاش)"><input id="newPayDetail" placeholder="التفاصيل / الرقم"></div><button class="btn-gold" style="width:100%;margin-top:8px" onclick="addPay()">➕ إضافة</button></div>');
}
function addPay(){ var p=loadLS('ge_pay',[]); p.push({name:document.getElementById('newPayName').value||'طريقة جديدة',detail:document.getElementById('newPayDetail').value||'',active:true}); saveLS('ge_pay',p); toast('تمت الإضافة ✅'); goTab('pay'); }
function savePay(i){ var p=loadLS('ge_pay',[]); p[i].name=document.getElementById('payN'+i).value; p[i].detail=document.getElementById('payD'+i).value; saveLS('ge_pay',p); toast('تم الحفظ ✅'); goTab('pay'); }
function togglePay(i){ var p=loadLS('ge_pay',[]); p[i].active=!p[i].active; saveLS('ge_pay',p); goTab('pay'); }
function delPay(i){ var p=loadLS('ge_pay',[]); p.splice(i,1); saveLS('ge_pay',p); goTab('pay'); }
// ---- WALLET ----
async function tabWallet(){
  initSb();
  var localW=loadLS('ge_platform_wallet',0);
  var sbW=null;
  try{ var r=await sb.from('platform_wallet').select('*').limit(1); if(r.data && r.data.length) sbW=r.data[0]; }catch(e){}
  setContent('<h2>🏦 محفظة المنصة</h2>'+
    '<div class="card" style="text-align:center"><small>الرصيد المحلي</small><b style="font-size:26px;display:block;color:#FFD700">'+fmt(localW)+'</b>'+
    (sbW?'<small>Supabase: '+(sbW.balance!=null?fmt(sbW.balance):JSON.stringify(sbW))+'</small>':'<small>لا توجد محفظة بـ Supabase — استخدم الشحن اليدوي</small>')+'</div>'+
    '<div class="card"><h4>➕ شحن محفظة المنصة</h4><input id="fundAmt" type="number" placeholder="المبلغ $"><button class="btn-gold" style="width:100%;margin-top:8px" onclick="fundWallet()">🏦 شحن</button></div>'+
    '<div class="card"><h4>🎁 إضافة رصيد لزبون</h4><p class="small">هدية / تصحيح — ما يسحب من محفظة المنصة.</p><input id="creditEmail" placeholder="إيميل الزبون"><input id="creditAmount" type="number" placeholder="المبلغ $"><input id="creditNote" placeholder="ملاحظة"><button class="btn-gold" style="width:100%;margin-top:8px" onclick="creditCustomer()">➕ إضافة رصيد للزبون</button></div>'+
    '<div class="card"><h4>🏆 جائزة — تسحب من المحفظة</h4><input id="prizeEmail" placeholder="إيميل الفائز"><input id="prizeAmount" type="number" placeholder="المبلغ $"><input id="prizeReason" placeholder="السبب - مثال: مسابقة رمضان / هدية"><button class="btn-gold" style="width:100%;margin-top:8px" onclick="givePrize()">🏆 إرسال الجائزة</button></div>'
  );
}
function fundWallet(){
  var a=parseFloat(document.getElementById('fundAmt').value)||0; if(!a||a<=0){toast('اكتب مبلغ صحيح');return;}
  var w=loadLS('ge_platform_wallet',0)+a; saveLS('ge_platform_wallet',w); toast('تم شحن المحفظة ✅ '+fmt(w)); goTab('wallet');
}
async function creditCustomer(){
  var email=(document.getElementById('creditEmail').value||'').trim(); var amt=parseFloat(document.getElementById('creditAmount').value)||0; var note=document.getElementById('creditNote').value||'إضافة من الأدمن';
  if(!email||!amt){ toast('اكتب الإيميل والمبلغ'); return; }
  try{
    var r=await sb.from('admin_credits').insert([{customer_email:email,amount:amt,note:note,status:'pending',admin_email:ADMIN_EMAIL}]);
    if(r.error){ toast('❌ '+r.error.message+' — انحفظ محلياً فقط'); }
    else toast('تم إرسال الرصيد للزبون ✅ - يوصله من يدخل للموقع');
  }catch(e){ toast('❌ '+e.message); }
}
async function givePrize(){
  var email=(document.getElementById('prizeEmail').value||'').trim(); var amt=parseFloat(document.getElementById('prizeAmount').value)||0; var reason=document.getElementById('prizeReason').value||'جائزة';
  if(!email||!amt){ toast('اكتب الإيميل والمبلغ'); return; }
  var w=loadLS('ge_platform_wallet',0);
  if(w<amt){ toast('رصيد المحفظة ما يكفي: '+fmt(w)); return; }
  saveLS('ge_platform_wallet',w-amt);
  try{ await sb.from('admin_credits').insert([{customer_email:email,amount:amt,note:reason+' - جائزة من المحفظة',status:'pending',admin_email:ADMIN_EMAIL}]); }catch(e){}
  toast('تم إرسال الجائزة ✅ - انسحب '+fmt(amt)+' من المحفظة'); goTab('wallet');
}

async function tabSettings(){
  initSb();
  var sessTxt='غير مسجل';
  try{ var r=await sb.auth.getSession(); if(r.data && r.data.session) sessTxt='✅ مسجل: '+r.data.session.user.email; }catch(e){}
  setContent('<h2>⚙️ الإعدادات</h2>'+
    '<div class="card"><p>الحالة: '+sessTxt+'</p><p class="small">Supabase: '+SUPABASE_URL+'</p>'+
    '<button class="btn-ghost" onclick="checkAll()">🔍 فحص كل الجداول</button><p class="small" id="checkRes" style="margin-top:8px"></p></div>'+
    '<div class="card"><h4>🔗 روابط</h4><div class="row"><button class="btn-ghost" onclick="location.href=\'index.html\'">🏠 الموقع</button><button class="btn-danger" onclick="doLogout()">🚪 خروج</button></div></div>'+
    '<div class="card"><h4>ℹ️ ملاحظات</h4><p class="small">• هذه اللوحة منفصلة ولا تظهر بگوگل (noindex).<br>• الاعتماد/الرفض بالقوة: Edge أولاً، وإذا فشل تحديث مباشر.<br>• الخطط: الحفظ يدفع لـ Supabase فوراً.<br>• الأكواد وطرق الدفع محلية (نفس المتصفح) — تظهر بالموقع فوراً.</p></div>'
  );
}
async function checkAll(){
  var tables=['plans','plan_orders','deposits_log','money_requests','ge_users','support_messages','announcements','platform_wallet','ledger'];
  var out=[];
  for(var i=0;i<tables.length;i++){
    try{ var r=await sb.from(tables[i]).select('id',{count:'exact',head:true}); out.push('✅ '+tables[i]+': '+(r.count!=null?r.count:'?')+(r.error?' (خطأ: '+r.error.message+')':'')); }
    catch(e){ out.push('❌ '+tables[i]+': '+e.message); }
  }
  document.getElementById('checkRes').innerHTML=out.join('<br>');
}
checkSession();
</script>
